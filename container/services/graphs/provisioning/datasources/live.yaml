apiVersion: 1
datasources:
  # The live JSON of two local services, polled by the panels that use it:
  # usage-db's /forecast.json (budgets, burn rates, mode) and status's /status.json
  # (agents, services, presence, GPU lock, games). Only those two hosts are allowed.
  - name: live
    uid: live
    type: yesoreyeram-infinity-datasource
    access: proxy
    editable: false
    jsonData:
      allowedHosts:
        - http://127.0.0.1:8420
        - http://127.0.0.1:8421
