apiVersion: 1
datasources:
  # The Moonlander key-usage database moonlander-leds writes on the host.
  - name: keyboard
    uid: keyboard
    type: frser-sqlite-datasource
    access: proxy
    editable: false
    jsonData:
      pathPrefix: "file:"
      path: ${KEYBOARD_DB}
      pathOptions: "mode=ro"
