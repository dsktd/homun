<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CAD models</title>
<style>
:root{--bg:#fff;--fg:#222;--mute:#666}
@media (prefers-color-scheme:dark){:root{--bg:#161616;--fg:#ddd;--mute:#999}}
body{margin:0;background:var(--bg);color:var(--fg);font:15px system-ui,sans-serif;display:flex;height:100vh}
nav{width:220px;padding:12px 16px;overflow:auto;flex:none}
nav a{display:block;color:var(--fg);padding:3px 0;cursor:pointer}
nav a.on{font-weight:700}
main{flex:1;min-width:0;position:relative}
main>*{position:absolute;inset:0;width:100%;height:100%}
.mute{color:var(--mute)}
@media (max-width:600px){body{flex-direction:column}nav{width:auto;max-height:30vh}main{min-height:60vh}}
</style></head><body>
<nav><h3>models/</h3><div id="list" class="mute">loading</div></nav>
<main id="view"></main>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from "three";
import {STLLoader} from "three/addons/loaders/STLLoader.js";
import {OrbitControls} from "three/addons/controls/OrbitControls.js";
const view = document.getElementById("view"), list = document.getElementById("list");
let stop = () => {}, current = null, stamp = {};
function show(name) {
  stop(); current = name; view.replaceChildren();
  document.querySelectorAll("nav a").forEach(a => a.classList.toggle("on", a.dataset.n === name));
  const url = "models/" + encodeURIComponent(name) + "?t=" + Date.now();
  if (name.endsWith(".svg")) { const i = document.createElement("img"); i.src = url; i.style.objectFit = "contain"; view.append(i); return; }
  const r = new THREE.WebGLRenderer({antialias: true, alpha: true});
  r.setPixelRatio(devicePixelRatio); view.append(r.domElement);
  const scene = new THREE.Scene(), cam = new THREE.PerspectiveCamera(45, 1, .1, 1e5);
  scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 2.2));
  const sun = new THREE.DirectionalLight(0xffffff, 2); sun.position.set(1, 2, 3); scene.add(sun);
  const ctl = new OrbitControls(cam, r.domElement);
  new STLLoader().load(url, g => {
    const m = new THREE.Mesh(g, new THREE.MeshStandardMaterial({color: 0x8aa4c8, metalness: .1, roughness: .6}));
    g.computeBoundingSphere(); const s = g.boundingSphere;
    m.position.sub(s.center); scene.add(m);
    cam.position.set(0, 0, s.radius * 2.8); ctl.update();
  });
  let on = true;
  (function loop() { if (!on) return; const w = view.clientWidth, h = view.clientHeight;
    r.setSize(w, h, false); cam.aspect = w / h; cam.updateProjectionMatrix();
    r.render(scene, cam); requestAnimationFrame(loop); })();
  stop = () => { on = false; r.dispose(); };
}
async function refresh() {
  const html = await (await fetch("models/", {cache: "no-store"})).text();
  const names = [...new DOMParser().parseFromString(html, "text/html").querySelectorAll("a")]
    .map(a => decodeURIComponent(a.getAttribute("href"))).filter(n => /\.(stl|svg)$/i.test(n));
  const key = names.join("\n");
  if (list.dataset.key !== key) {
    list.dataset.key = key; list.replaceChildren();
    if (!names.length) list.textContent = "no .stl or .svg yet";
    names.forEach(n => { const a = document.createElement("a"); a.textContent = n; a.dataset.n = n; a.onclick = () => show(n); list.append(a); });
    document.querySelectorAll("nav a").forEach(a => a.classList.toggle("on", a.dataset.n === current));
  }
  if (!current && names.length) show(names[0]);
  // reload the open model when its file changes (microcad watch)
  if (current) { const h = await fetch("models/" + encodeURIComponent(current), {method: "HEAD", cache: "no-store"});
    const m = h.headers.get("last-modified"); if (stamp[current] && stamp[current] !== m) show(current); stamp[current] = m; }
}
refresh(); setInterval(refresh, 3000);
</script></body></html>
