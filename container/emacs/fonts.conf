<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Fontconfig for Claude's Emacs (FONTCONFIG_FILE in the emacs service's env):
     the fonts emacs.nix puts into the default Nix profile, nothing else. -->
<fontconfig>
  <dir>/nix/var/nix/profiles/default/share/fonts</dir>
  <cachedir>~/claude/.services/emacs/state/fontconfig</cachedir>
  <alias><family>monospace</family><prefer><family>JetBrains Mono</family><family>DejaVu Sans Mono</family></prefer></alias>
  <alias><family>sans-serif</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <alias><family>serif</family><prefer><family>DejaVu Serif</family></prefer></alias>
  <alias><family>emoji</family><prefer><family>Noto Color Emoji</family></prefer></alias>
</fontconfig>
