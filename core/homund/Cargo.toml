[package]
name = "homund"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
libc = "0.2"
sha2 = "0.10"
toml = "0.9"

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
strip = true
